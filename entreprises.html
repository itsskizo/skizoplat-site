<style>

    color-scheme: light;
    --ink:            #142521;
    --ink-secondary:  #4b5d58;
    --ink-faint:      #7c8b86;

    --surface:        #ffffff;
    --border:         #dde2da;
    --border-strong:  #c4ccc1;

    --warn:           #eda100;

      color-scheme: dark;

      --ink-secondary:  #b9c4bd;
      --ink-faint:      #7d8a83;
      --paper:          #101512;
      --surface:        #171d19;
      --border:         #2a322c;
      --border-strong:  #3a453d;
      --accent:         #3987e5;
      --accent-ink:     #061020;
      --gain:           #d95926;
      --good:           #1cbf1c;
      --warn:           #c98500;
      --bad:            #e66767;

      --focus:          0 0 0 3px rgba(57,135,229,.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink:            #f2f4f0;
    --ink-secondary:  #b9c4bd;
    --ink-faint:      #7d8a83;
    --paper:          #101512;
    --surface:        #171d19;
    --border:         #2a322c;
    --border-strong:  #3a453d;
    --accent:         #3987e5;
    --accent-ink:     #061020;
    --gain:           #d95926;
    --good:           #1cbf1c;
    --warn:           #c98500;
    --bad:            #e66767;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .display { font-family: "Fraunces", Georgia, serif; text-wrap: balance; }
  a { color: inherit; }
  button { font-family: inherit; }

  .shell { max-width: 900px; margin: 0 auto; padding: 0 24px 96px; }

  nav.topbar { border-bottom: 1px solid var(--border); background: var(--paper); position: sticky; top: 0; z-index: 20; }
  .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; }
  .brand strong { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 15px; }
  .site-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .site-nav a.item, .site-nav span.item { font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid transparent; color: var(--ink-secondary); white-space: nowrap; text-decoration: none; }
  .site-nav a.item:hover { color: var(--ink); }
  .site-nav .item.active { background: var(--surface); border-color: var(--border-strong); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  .site-nav .item.soon { color: var(--ink-faint); border: 1px dashed var(--border-strong); display: flex; gap: 6px; align-items: center; }
  .site-nav .item.soon .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint); }
  .theme-toggle-btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
    border-radius: 999px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; cursor: pointer; padding: 0; font-family: inherit;
  }
  .theme-toggle-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .theme-toggle-btn:focus-visible { outline: none; box-shadow: var(--focus); }

  .segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .segmented button { border: none; background: var(--surface); color: var(--ink-secondary); font-size: 12.5px; font-weight: 600; padding: 6px 11px; cursor: pointer; font-family: inherit; }
  .segmented button + button { border-left: 1px solid var(--border-strong); }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .segmented button:focus-visible { outline: none; box-shadow: var(--focus); position: relative; z-index: 1; }

  header.hero { padding: 44px 0 24px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  header.hero h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 600; margin: 0 0 12px; line-height: 1.15; }
  header.hero p { font-size: 15.5px; color: var(--ink-secondary); max-width: 62ch; margin: 0; line-height: 1.55; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  .company-picker { margin: 22px 0 28px; }
  .company-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .company-pills button {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
    font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .company-pills button:hover { color: var(--ink); }
  .company-pills button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .company-pills button:focus-visible { outline: none; box-shadow: var(--focus); }
  .company-picker .picker-note { font-size: 12.5px; color: var(--ink-faint); line-height: 1.5; }
  .company-picker .picker-note a { text-decoration: underline; text-decoration-color: var(--border-strong); }
  .company-picker .picker-note a:hover { color: var(--ink); }

  .fiche { padding: 26px 26px 28px; margin-bottom: 20px; }
  .fiche-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 6px; }
  .fiche-id { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .fiche-id h2 { margin: 0; font-size: 22px; }
  .ticker-badge {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600;
    color: var(--ink-secondary); background: var(--paper); border: 1px solid var(--border-strong);
    padding: 2px 8px; border-radius: 6px;
  }
  .sector-line { font-size: 12.5px; color: var(--ink-faint); margin: 4px 0 0; }
  .update-badge {
    font-size: 11px; color: var(--ink-faint); border: 1px dashed var(--border-strong); border-radius: 999px;
    padding: 4px 10px; white-space: nowrap;
  }

  .overview-p { font-size: 14.5px; line-height: 1.65; color: var(--ink-secondary); margin: 16px 0 22px; }

  .section-label { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .section-label.risk { color: var(--bad); }
  .section-label.catalyst { color: var(--good); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat-tile { background: var(--paper); border: 1px solid var(--border); border-radius: 10px; padding: 12px 13px; }
  .stat-tile .stat-label { font-size: 11px; color: var(--ink-faint); line-height: 1.35; margin: 0 0 5px; }
  .stat-tile .stat-value { font-size: 17px; font-weight: 600; margin: 0; }
  .stat-tile .stat-note { font-size: 11px; color: var(--ink-secondary); margin: 3px 0 0; }
  .stat-tile .stat-note.up { color: var(--good); }
  .stat-tile .stat-note.down { color: var(--bad); }

  .bullets { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .bullets li { font-size: 13.5px; line-height: 1.55; color: var(--ink-secondary); padding-left: 20px; position: relative; }
  .bullets.catalyst li::before { content: "+"; position: absolute; left: 0; top: 0; color: var(--good); font-weight: 700; }
  .bullets.risk li::before { content: "!"; position: absolute; left: 2px; top: 0; color: var(--bad); font-weight: 700; }

  .conclusion-box {
    background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; font-size: 13.5px; line-height: 1.6; color: var(--ink-secondary);
  }
  .conclusion-box strong { color: var(--ink); }

  .sources-line { margin-top: 14px; font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; }
  .sources-line a { text-decoration: underline; text-decoration-color: var(--border-strong); }
  .sources-line a:hover { color: var(--ink); }

  footer.disclaimer { margin-top: 20px; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 12px; color: var(--ink-faint); line-height: 1.6; background: var(--surface); }
  footer.disclaimer strong { color: var(--ink-secondary); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      '<p class="stat-label">' + item.label[l] + '</p>' +
      '<p class="stat-value num">' + item.value + '</p>' +

        '<ul class="bullets risk">' + risksHtml + "</ul>" +

        '<p class="section-label">' + ui.secConclusion + "</p>" +
        '<div class="conclusion-box"><strong>' + ui.secConclusion + " — </strong>" + c.conclusion[l] + "</div>" +

        '<p class="sources-line">' + ui.sourcesPrefix + " " + sourcesHtml + "</p>" +
      "</div>";

    updatePickerControls();
  }

  document.getElementById("companyGroup").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    state.company = btn.getAttribute("data-company");
    render();
  });

  window.SkizoI18n.initToggle(I18N, function () {
    render();
    if (window.SkizoTheme) window.SkizoTheme.refreshLabel();
  });
  if (window.SkizoTheme) window.SkizoTheme.initToggle();
})();
</script>
</body>
</html>
