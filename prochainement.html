<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prochainement</title>
<style>
  :root {
    color-scheme: light;
    --ink:            #142521;
    --ink-secondary:  #4b5d58;
    --ink-faint:      #7c8b86;
    --paper:          #f3f5f0;
    --surface:        #ffffff;
    --border:         #dde2da;
    --border-strong:  #c4ccc1;
    --accent:         #2a78d6;
    --accent-ink:     #ffffff;
    --gain:           #eb6834;
    --good:           #0ca30c;
    --warn:           #eda100;
    --bad:            #d03b3b;
    --shadow:         0 1px 2px rgba(20,37,33,.04), 0 8px 24px -12px rgba(20,37,33,.15);
    --focus:          0 0 0 3px rgba(42,120,214,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink:            #f2f4f0;
      --ink-secondary:  #b9c4bd;
      --ink-faint:      #7d8a83;
      --paper:          #101512;
      --surface:        #171d19;
      --border:         #2a322c;
      --border-strong:  #3a453d;
      --accent:         #3987e5;
      --accent-ink:     #061020;
      --gain:           #d95926;
      --good:           #1cbf1c;
      --warn:           #c98500;
      --bad:            #e66767;
      --shadow:         0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      --focus:          0 0 0 3px rgba(57,135,229,.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink:            #f2f4f0;
    --ink-secondary:  #b9c4bd;
    --ink-faint:      #7d8a83;
    --paper:          #101512;
    --surface:        #171d19;
    --border:         #2a322c;
    --border-strong:  #3a453d;
    --accent:         #3987e5;
    --accent-ink:     #061020;
    --gain:           #d95926;
    --good:           #1cbf1c;
    --warn:           #c98500;
    --bad:            #e66767;
    --shadow:         0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    --focus:          0 0 0 3px rgba(57,135,229,.4);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .display { font-family: "Fraunces", Georgia, serif; text-wrap: balance; }
  a { color: inherit; }
  button { font-family: inherit; }

  .shell { max-width: 900px; margin: 0 auto; padding: 0 24px 96px; }

  nav.topbar { border-bottom: 1px solid var(--border); background: var(--paper); position: sticky; top: 0; z-index: 20; }
  .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; }
  .brand strong { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 15px; }
  .site-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .site-nav a.item, .site-nav span.item { font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid transparent; color: var(--ink-secondary); white-space: nowrap; text-decoration: none; }
  .site-nav a.item:hover { color: var(--ink); }
  .site-nav .item.active { background: var(--surface); border-color: var(--border-strong); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  .site-nav .item.soon { color: var(--ink-faint); border: 1px dashed var(--border-strong); display: flex; gap: 6px; align-items: center; }
  .site-nav .item.soon .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint); }
  .theme-toggle-btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
    border-radius: 999px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; cursor: pointer; padding: 0; font-family: inherit;
  }
  .theme-toggle-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .theme-toggle-btn:focus-visible { outline: none; box-shadow: var(--focus); }

  .segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .segmented button { border: none; background: var(--surface); color: var(--ink-secondary); font-size: 12.5px; font-weight: 600; padding: 6px 11px; cursor: pointer; font-family: inherit; }
  .segmented button + button { border-left: 1px solid var(--border-strong); }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .segmented button:focus-visible { outline: none; box-shadow: var(--focus); position: relative; z-index: 1; }

  header.hero { padding: 44px 0 24px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  header.hero h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 600; margin: 0 0 12px; line-height: 1.15; }
  header.hero p { font-size: 15.5px; color: var(--ink-secondary); max-width: 62ch; margin: 0; line-height: 1.55; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  .soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 10px; }
  .soon-card { padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 8px; }
  .soon-badge {
    align-self: flex-start; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    padding: 4px 10px; border-radius: 999px;
  }
  .soon-card h3 { margin: 2px 0 0; font-size: 15.5px; font-weight: 600; }
  .soon-card p { margin: 0; font-size: 13px; color: var(--ink-secondary); line-height: 1.55; }

  footer.disclaimer { margin-top: 36px; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 12px; color: var(--ink-faint); line-height: 1.6; background: var(--surface); }
  footer.disclaimer strong { color: var(--ink-secondary); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand" data-i18n-html="brand"></div>
    <div class="site-nav">
      <a class="item" href="/" data-i18n="nav_quiz"></a>
      <a class="item" href="/simulateur.html" data-i18n="nav_sim"></a>
      <a class="item" href="/broker.html" data-i18n="nav_broker"></a>
      <a class="item" href="/etf.html" data-i18n="nav_etf"></a>
      <span class="item active" data-i18n="nav_soon"></span>
      <span class="item soon" data-i18n-html="nav_finances"></span>
      <div class="segmented lang-toggle" id="langToggle">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="theme-toggle-btn" id="themeToggle">🌙</button>
    </div>
  </div>
</nav>

<div class="shell">
  <header class="hero">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="heroH1"></h1>
    <p data-i18n="heroP"></p>
  </header>

  <div class="soon-grid" id="soonGrid"></div>

  <footer class="disclaimer" data-i18n-html="footer"></footer>
</div>

<script src="/i18n.js"></script>
<script src="/theme.js"></script>
<script>
(function () {
  "use strict";

  var I18N = {
    fr: {
      pageTitle: "Prochainement",
      brand: 'plateforme investissement <strong>· édition de travail</strong>',
      nav_quiz: "Quiz",
      nav_sim: "Simulateur",
      nav_broker: "Broker",
      nav_etf: "ETF",
      nav_soon: "Prochainement",
      nav_finances: '<span class="dot"></span>Mes finances',
      eyebrow: "À venir",
      heroH1: "Ce qui arrive bientôt",
      heroP: "Les prochaines briques du site, dans l'ordre où elles ont été évoquées avec Zak. Pas de vote ici — juste ce qui est prévu, pour que tu saches à quoi t'attendre.",
      footer: "<strong>À garder en tête :</strong> ces fonctionnalités sont en préparation, sans date précise. L'ordre peut changer selon les retours et les priorités."
    },
    en: {
      pageTitle: "Coming soon",
      brand: 'investment platform <strong>· working edition</strong>',
      nav_quiz: "Quiz",
      nav_sim: "Simulator",
      nav_broker: "Broker",
      nav_etf: "ETF",
      nav_soon: "Coming soon",
      nav_finances: '<span class="dot"></span>My finances',
      eyebrow: "Coming up",
      heroH1: "What's coming next",
      heroP: "The next building blocks for the site, in the order they came up with Zak. No voting here — just what's planned, so you know what to expect.",
      footer: "<strong>Keep in mind:</strong> these features are in the works, with no fixed date. The order may change based on feedback and priorities."
    }
  };

  var ITEMS = {
    fr: [
      { title: "Mes finances", desc: "Un tableau de bord personnel — patrimoine, budget, portefeuille — avec un compte sécurisé pour garder tes données privées." },
      { title: "Page d'accueil parcours guidé", desc: "Un point d'entrée pas à pas pour les tout nouveaux visiteurs, avant même le quiz." },
      { title: "Lexique dédié", desc: "Un glossaire complet des mots de l'investissement, plus détaillé que le mini-lexique du quiz." },
      { title: "Psychologie du débutant", desc: "Un guide pour tenir bon face à la volatilité et à la peur de mal faire, au-delà de la réassurance du quiz." },
      { title: "Spécificités fiscales par pays", desc: "Le détail PEA/CTO en France, et les règles applicables au Luxembourg et au Maroc." },
      { title: "Rappels de versement mensuel", desc: "Des rappels pour ne jamais sauter un versement, en lien avec le simulateur." },
      { title: "Contenu éducatif complémentaire", desc: "Des articles courts pour approfondir chaque sujet, à ton rythme." }
    ],
    en: [
      { title: "My finances", desc: "A personal dashboard — net worth, budget, portfolio — with a secure account to keep your data private." },
      { title: "Guided homepage journey", desc: "A step-by-step entry point for brand-new visitors, even before the quiz." },
      { title: "Dedicated glossary", desc: "A full glossary of investing terms, more detailed than the quiz's built-in mini-glossary." },
      { title: "Beginner psychology", desc: "A guide to staying the course through volatility and the fear of getting it wrong, beyond the quiz's reassurance." },
      { title: "Country-specific tax details", desc: "The details on PEA/CTO in France, and the rules that apply in Luxembourg and Morocco." },
      { title: "Monthly contribution reminders", desc: "Reminders so you never miss a contribution, tied into the simulator." },
      { title: "More educational content", desc: "Short articles to go deeper on each topic, at your own pace." }
    ]
  };

  function lang() { return window.SkizoI18n ? window.SkizoI18n.getLang() : "fr"; }

  function renderItems() {
    var items = ITEMS[lang()];
    var ui = I18N[lang()];
    var soonLabel = ui.pageTitle === "Coming soon" ? "Soon" : "Bientôt disponible";
    document.getElementById("soonGrid").innerHTML = items.map(function (it) {
      return '<div class="card soon-card"><span class="soon-badge">' + soonLabel + '</span><h3>' + it.title + '</h3><p>' + it.desc + '</p></div>';
    }).join("");
  }

  window.SkizoI18n.initToggle(I18N, function () {
    renderItems();
    if (window.SkizoTheme) window.SkizoTheme.refreshLabel();
  });
  if (window.SkizoTheme) window.SkizoTheme.initToggle();
})();
</script>
</body>
</html>
