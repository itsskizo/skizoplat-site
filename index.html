      step1Desc: "The account you'll invest through — ranking and availability pre-filtered for you.",
      step2Title: "Choose your ETF",
      step2Desc: "The selection and comparison, with the Acc/Dist recommendation already pre-filled for you.",
      step3Title: "Simulate what it could give",
      step3Desc: "Project your capital over time based on your age and monthly contribution.",
      open: "Open →",
      restart: "↺ Retake the quiz",
      otherCountryNote: "The broker guide is mostly detailed for France, Luxembourg and Morocco — the principles (brokerage account type, replication, fees) still apply elsewhere, but check broker availability in your country yourself."
    }
  };

  var wrap = document.getElementById("quizWrap");
  var state = { index: 0, answers: {}, screen: "question" };

  function lang() { return window.SkizoI18n ? window.SkizoI18n.getLang() : "fr"; }

  function budgetToProfile(v) {
    if (v === "gt500") return "actif";
    if (v === "lumpsum") return "gros";
    return "debutant"; // lt100, 100to500
  }

  function renderProgress(activeIndex, total) {
    var html = "";
    for (var i = 0; i < total; i++) {
      var cls = i < activeIndex ? "done" : (i === activeIndex ? "current" : "");
      html += '<div class="quiz-dot ' + cls + '"></div>';
    }
    return html;
  }

  function renderQuestion() {
    state.screen = "question";
    var L = lang();
    var ui = UI[L];
    var questions = QUESTIONS[L];
    var q = questions[state.index];
    var selected = state.answers[q.id];
    var html = '<div class="card quiz-card">' +
      '<div class="quiz-progress">' + renderProgress(state.index, questions.length) + '</div>' +
      '<p class="quiz-step-label">' + q.label + '</p>' +
      '<p class="quiz-q">' + q.q + '</p>' +
      (q.help ? '<p class="quiz-help">' + q.help + '</p>' : '<div style="margin-bottom:22px"></div>') +
      '<div class="choice-grid" id="choiceGrid">';
    q.options.forEach(function (opt) {
      var sel = selected === opt.value ? " selected" : "";
      html += '<button type="button" class="choice' + sel + '" data-value="' + opt.value + '">' +
        '<span class="c-title">' + opt.title + '</span>' +
        (opt.sub ? '<span class="c-sub">' + opt.sub + '</span>' : "") +
        '</button>';
    });
    html += '</div>' +
      '<div class="quiz-nav">' +
      '<button type="button" class="btn btn-ghost" id="btnBack"' + (state.index === 0 ? " disabled" : "") + '>' + ui.back + '</button>' +
      '<button type="button" class="btn btn-primary" id="btnNext"' + (selected ? "" : " disabled") + '>' + (state.index === questions.length - 1 ? ui.seeResult : ui.next) + '</button>' +
      '</div>' +
      '</div>';
    wrap.innerHTML = html;

    document.getElementById("choiceGrid").querySelectorAll(".choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.answers[q.id] = btn.getAttribute("data-value");
        renderQuestion();
      });
    });
    var backBtn = document.getElementById("btnBack");
    if (backBtn) backBtn.addEventListener("click", function () { state.index--; renderQuestion(); });
    document.getElementById("btnNext").addEventListener("click", function () {
      if (!state.answers[q.id]) return;
      if (state.index < questions.length - 1) { state.index++; renderQuestion(); }
      else { renderResult(); }
    });
  }

  function renderResult() {
    state.screen = "result";
    var L = lang();
    var ui = UI[L];
    var a = state.answers;
    var country = a.country;
    var goal = a.goal === "unknown" ? "construire" : a.goal;
    var profile = budgetToProfile(a.budget);
    var isOtherCountry = country === "other";

    var brokerUrl = "/broker.html" +
      (isOtherCountry ? "" : "?country=" + country + "&profile=" + profile);
    var etfUrl = "/etf.html?goal=" + goal;
    var simUrl = "/simulateur.html";

    var html = '<div class="card quiz-card">' +
      '<p class="result-eyebrow">' + ui.yourProfile + '</p>' +
      '<p class="result-title">' + PROFILE_LABEL[L][profile] + (isOtherCountry ? "" : " · " + COUNTRY_LABEL[L][country]) + '</p>' +
      '<div class="result-chip-row">' +
      '<span class="result-chip">' + GOAL_LABEL[L][a.goal] + '</span>' +
      '<span class="result-chip">' + COUNTRY_LABEL[L][country] + '</span>' +
      '</div>' +
      '<div class="reassure-card">' + REASSURE[L][a.risk] + '</div>' +
      (isOtherCountry ? '<p class="other-country-note">' + ui.otherCountryNote + '</p>' : '') +
      '</div>' +

      '<section class="block">' +
      '<h2>' + ui.wordsTitle + '</h2>' +
      '<p class="block-sub">' + ui.wordsSub + '</p>' +
      '<div class="lexique-grid">' +
      LEXIQUE[L].map(function (l) {
        return '<div class="lex-item"><div class="lex-term">' + l.term + '</div><div class="lex-def">' + l.def + '</div></div>';
      }).join("") +
      '</div>' +
      '</section>' +

      '<section class="block">' +
      '<h2>' + ui.pathTitle + '</h2>' +
      '<p class="block-sub">' + ui.pathSub + '</p>' +
      '<div class="steps">' +
      '<div class="card step-card"><div class="step-num">1</div><div class="step-body"><div class="step-title">' + ui.step1Title + '</div><div class="step-desc">' + ui.step1Desc + '</div></div><a class="step-cta" href="' + brokerUrl + '" target="_blank" rel="noopener">' + ui.open + '</a></div>' +
      '<div class="card step-card"><div class="step-num">2</div><div class="step-body"><div class="step-title">' + ui.step2Title + '</div><div class="step-desc">' + ui.step2Desc + '</div></div><a class="step-cta" href="' + etfUrl + '" target="_blank" rel="noopener">' + ui.open + '</a></div>' +
      '<div class="card step-card"><div class="step-num">3</div><div class="step-body"><div class="step-title">' + ui.step3Title + '</div><div class="step-desc">' + ui.step3Desc + '</div></div><a class="step-cta" href="' + simUrl + '" target="_blank" rel="noopener">' + ui.open + '</a></div>' +
      '</div>' +
      '</section>' +

      '<div style="margin-top:26px"><button type="button" class="btn btn-ghost" id="btnRestart">' + ui.restart + '</button></div>';

    wrap.innerHTML = html;
    document.getElementById("btnRestart").addEventListener("click", function () {
      state = { index: 0, answers: {} };
      renderQuestion();
    });
  }

  function render() {
    if (state.screen === "result") renderResult();
    else renderQuestion();
  }

  window.SkizoI18n.initToggle(I18N, function () {
    render();
  });
})();
</script>
</body>
</html>
